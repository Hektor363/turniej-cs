<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turniej CS2 - Studenci 2024</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #ff9800;
            --text: #ffffff;
            --secondary: #b0b0b0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        h1, h2 { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Tabele Grupowe */
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .group-card { background: var(--card); border-radius: 8px; padding: 15px; border-top: 4px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--secondary); font-size: 0.8rem; padding: 8px; border-bottom: 1px solid #333; }
        td { padding: 10px 8px; border-bottom: 1px solid #2a2a2a; }
        .rank-1, .rank-2 { color: #4caf50; font-weight: bold; } /* Miejsca premiowane awansem */

        /* Drabinka */
        .bracket { display: flex; justify-content: space-around; align-items: center; background: var(--card); padding: 40px 20px; border-radius: 8px; overflow-x: auto; }
        .round { display: flex; flex-direction: column; justify-content: space-around; min-width: 150px; }
        .match { background: #2a2a2a; border: 1px solid #444; padding: 10px; margin: 10px 0; border-radius: 4px; font-size: 0.9rem; }
        .match span { display: block; padding: 2px 0; }
        .match .winner { color: var(--accent); font-weight: bold; }
        .vs { color: var(--secondary); font-size: 0.7rem; margin: 5px 0; border-top: 1px solid #444; padding-top: 5px; }

        .footer { text-align: center; margin-top: 50px; color: var(--secondary); font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Turniej CS2 - Uczelnia 2024</h1>
    <p style="text-align: center; color: var(--secondary);">Faza Grupowa (2 tygodnie) & Play-offy</p>

    <h2>FAZA GRUPOWA</h2>
    <div class="groups-grid" id="groups-container">
        </div>

    <h2>DRABINKA PUCHAROWA (TOP 8)</h2>
    <div class="bracket">
        <div class="round">
            <div class="match"><span>1A vs 2B</span><div class="vs"></div><span>Winner Q1</span></div>
            <div class="match"><span>1C vs 2D</span><div class="vs"></div><span>Winner Q2</span></div>
            <div class="match"><span>1B vs 2A</span><div class="vs"></div><span>Winner Q3</span></div>
            <div class="match"><span>1D vs 2C</span><div class="vs"></div><span>Winner Q4</span></div>
        </div>
        <div class="round">➔</div>
        <div class="round">
            <div class="match"><span>Półfinał 1</span><div class="vs"></div><span>Finalista 1</span></div>
            <div class="match"><span>Półfinał 2</span><div class="vs"></div><span>Finalista 2</span></div>
        </div>
        <div class="round">➔</div>
        <div class="round">
            <div class="match" style="border: 2px solid var(--accent);">
                <strong>WIELKI FINAŁ</strong>
                <div class="vs"></div>
                <span>???</span>
            </div>
        </div>
    </div>

    <div class="footer">Strona aktualizowana codziennie o 22:00</div>
</div>

<script>
    // ==========================================
    // DATA - TUTAJ EDYTUJESZ WYNIKI I DRUŻYNY
    // ==========================================
    const teams = [
        { name: "Team Potężni", group: "A", w: 2, l: 0, diff: +24 },
        { name: "Akademik United", group: "A", w: 1, l: 1, diff: -2 },
        { name: "Rush B", group: "A", w: 0, l: 1, diff: -10 },
        { name: "Eco Round", group: "A", w: 0, l: 1, diff: -12 },

        { name: "Cztery Piwa", group: "B", w: 1, l: 0, diff: +13 },
        { name: "Global Elite", group: "B", w: 0, l: 0, diff: 0 },
        { name: "Noobs", group: "B", w: 0, l: 1, diff: -13 },
        { name: "Silver Kings", group: "B", w: 0, l: 0, diff: 0 },

        { name: "Team C1", group: "C", w: 0, l: 0, diff: 0 },
        { name: "Team C2", group: "C", w: 0, l: 0, diff: 0 },
        { name: "Team C3", group: "C", w: 0, l: 0, diff: 0 },

        { name: "Team D1", group: "D", w: 0, l: 0, diff: 0 },
        { name: "Team D2", group: "D", w: 0, l: 0, diff: 0 },
        { name: "Team D3", group: "D", w: 0, l: 0, diff: 0 }
    ];

    // Funkcja generująca tabele
    function renderGroups() {
        const groups = ["A", "B", "C", "D"];
        const container = document.getElementById('groups-container');
        
        groups.forEach(letter => {
            const groupTeams = teams
                .filter(t => t.group === letter)
                .sort((a, b) => (b.w * 3) - (a.w * 3) || b.diff - a.diff);

            let html = `
                <div class="group-card">
                    <h3>Grupa ${letter}</h3>
                    <table>
                        <tr><th>#</th><th>Drużyna</th><th>W-P</th><th>+/-</th><th>Pkt</th></tr>`;
            
            groupTeams.forEach((t, i) => {
                html += `
                    <tr>
                        <td class="rank-${i+1}">${i+1}</td>
                        <td>${t.name}</td>
                        <td>${t.w}-${t.l}</td>
                        <td>${t.diff > 0 ? '+' + t.diff : t.diff}</td>
                        <td><strong>${t.w * 3}</strong></td>
                    </tr>`;
            });
            html += `</table></div>`;
            container.innerHTML += html;
        });
    }

    renderGroups();
</script>
</body>
</html>
